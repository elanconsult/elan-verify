<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELAN CONSULT - Vérification</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #F4F6FA; min-height: 100vh; }

  /* ===== EN HAUT - CENTRÉ ===== */
  .header {
    background: #0052BE;
    color: white;
    text-align: center;
    padding: 22px 12px 18px 12px;
    border-bottom: 5px solid #FFC107;
    width: 100%;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.2;
    margin: 0 auto;
  }
  .header h1 .orange {
    color: #FF6B35;
  }
  .header .slogan {
    font-size: 19px;
    font-weight: 700;
    color: white;
    text-align: center;
    line-height: 1.35;
    margin: 10px auto 0 auto;
    max-width: 340px;
    word-break: normal;
    overflow-wrap: normal;
  }
  .header .sous-slogan {
    font-size: 13px;
    color: #FFD966;
    text-align: center;
    margin-top: 6px;
    font-weight: 600;
  }

  .container {
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }
  .container h2 {
    text-align: center;
    font-size: 19px;
    margin-bottom: 4px;
    color: #1A2233;
  }
  .container .sous-titre {
    text-align: center;
    font-size: 13px;
    color: #5A6473;
    margin-bottom: 18px;
  }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px 0; color: #1A2233; text-align: left; }
  input {
    width: 100%;
    padding: 12px 12px;
    border: 1px solid #D9DEE8;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    text-align: center;
  }
  input:focus { border-color: #0052BE; }
  .btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    background: #0052BE;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn:active { background: #003D8F; }

  #resultat {
    display: none;
    margin-top: 18px;
    padding: 15px;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    border-radius: 10px;
    line-height: 1.4;
  }
  .infos {
    display: none;
    margin-top: 14px;
    background: #F8FAFF;
    border: 1px solid #D9DEE8;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.7;
    text-align: left;
  }
  .infos b { color: #0052BE; }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #8A93A6;
    margin-top: 18px;
    padding-bottom: 20px;
  }
</style>
</head>
<body>

  <!-- ===== HAUT - ALIGNÉ AU CENTRE ===== -->
  <div class="header">
    <h1>CABINET<br>ELAN <span class="orange">CONSULT</span></h1>
    <p class="slogan">Finis l'usage des faux documents.</p>
    <p class="sous-slogan">Vérifiez vos documents en 5 secondes.</p>
  </div>

  <div class="container">
    <h2>Vérification du personnel</h2>
    <p class="sous-titre">Scanne le QR du badge ou tape les infos</p>

    <label>No ID</label>
    <input type="text" id="no_id" placeholder="Ex : mat-1">

    <label>Hash de vérification</label>
    <input type="text" id="hash" placeholder="Ex : 10C0B9595D71...">

    <button class="btn" onclick="verifier()">VÉRIFIER</button>

    <!-- Rien affiché au début, plus de FAUX en dur -->
    <div id="resultat"></div>
    <div id="infos" class="infos"></div>
  </div>

  <p class="footer">ELAN CONSULT © 2026 - Vérification officielle</p>

<script>
function verifier() {
  const no_id = document.getElementById('no_id').value.trim();
  const hash = document.getElementById('hash').value.trim().toUpperCase();
  const res = document.getElementById('resultat');
  const infos = document.getElementById('infos');

  infos.style.display = 'none';
  infos.innerHTML = '';

  if(!no_id || !hash){
    res.style.display = 'block';
    res.style.background = '#FFF3CD';
    res.style.color = '#856404';
    res.textContent = 'Remplis No ID + Hash d\'abord';
    return;
  }

  fetch('verification_employes.json')
    .then(r => {
      if(!r.ok) throw new Error('fichier introuvable');
      return r.json();
    })
    .then(liste => {
      const trouve = liste.find(e => e.no_id === no_id);
      res.style.display = 'block';

      // 1. Pas trouvé = FAUX
      if(!trouve){
        res.style.background = '#FCE8E6';
        res.style.color = '#A50E0E';
        res.textContent = '❌ FAUX DOCUMENT - Non reconnu';
        return;
      }

      // 2. Hash modifié = FAUX
      const hashOk = (trouve.hash && trouve.hash.toUpperCase() === hash) ||
                     (trouve.hash_complet && trouve.hash_complet.toUpperCase().startsWith(hash));
      if(!hashOk){
        res.style.background = '#FCE8E6';
        res.style.color = '#A50E0E';
        res.textContent = '❌ FAUX DOCUMENT - Hash modifié';
        return;
      }

      // 3. Vrai document -> on regarde le STATUT
      infos.style.display = 'block';
      infos.innerHTML = '<b>Nom :</b> ' + trouve.nom + '<br>' +
                        '<b>Fonction :</b> ' + trouve.fonction + '<br>' +
                        '<b>Entreprise :</b> ' + trouve.entreprise + '<br>' +
                        '<b>Téléphone :</b> ' + (trouve.telephone || '') + '<br>' +
                        '<b>No ID :</b> ' + trouve.no_id;

      if(trouve.statut === 'Actif'){
        res.style.background = '#E6F4EA';
        res.style.color = '#137333';
        res.textContent = '✅ VRAI DOCUMENT - ACTIF chez ' + trouve.entreprise;
      } else {
        res.style.background = '#FFF3CD';
        res.style.color = '#856404';
        res.textContent = '⚠️ A QUITTÉ L\'ENTREPRISE - Ne plus accepter ce badge';
      }
    })
    .catch(() => {
      res.style.display = 'block';
      res.style.background = '#FCE8E6';
      res.style.color = '#A50E0E';
      res.textContent = '❌ Erreur : fichier verification_employes.json introuvable sur GitHub';
    });
}

// Auto-remplissage si on arrive depuis le QR : ?id=mat-1&hash=...
const params = new URLSearchParams(window.location.search);
if(params.get('id')) document.getElementById('no_id').value = params.get('id');
if(params.get('hash')) document.getElementById('hash').value = params.get('hash');
if(params.get('id') && params.get('hash')) verifier();
</script>

</body>
</html>
