<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification Certificat</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:20px;background:#f5f5f5}
.box{border:2px solid #0052be;border-radius:12px;padding:20px;max-width:420px;margin:auto;background:white;text-align:left}
h2{text-align:center;color:#0052be}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;background:#0052be;color:white;border:none;border-radius:8px;font-size:16px}
.ok{color:green;font-weight:bold;text-align:center}
.bad{color:red;font-weight:bold;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>Verification Certificat</h2>
<p style="text-align:center">Scannez le QR, puis entrez ce qu'il affiche</p>
<label>No ID :</label>
<input id="no_id" placeholder="Ex : ELAN-2026-03">
<label>Hash :</label>
<input id="hash" placeholder="Hash du certificat">
<button onclick="verif()">Verifier</button>
<p id="res"></p>
<div id="infos"></div>
</div>
<script>
async function verif(){
  const no_id = document.getElementById("no_id").value.trim();
  const hash = document.getElementById("hash").value.trim().toLowerCase();
  const res = document.getElementById("res");
  const infos = document.getElementById("infos");
  infos.innerHTML = "";
  if(!no_id || !hash){ res.innerHTML = "<span class='bad'>Entrez No ID + Hash</span>"; return; }
  res.innerHTML = "Verification...";
  const r = await fetch("Certificats.json?v="+Date.now());
  const data = await r.json();
  const trouve = data.find(x => x.no_id === no_id);
  if(!trouve){ res.innerHTML = "<span class='bad'>❌ INTROUVABLE - Faux</span>"; return; }
  const h1 = String(trouve.hash || "").toLowerCase();
  const h2 = String(trouve.hash_complet || "").toLowerCase();
  // Ancien systeme : on accepte hash court ou hash complet
  const ok = hash === h1 || hash === h2 || h2.startsWith(hash) || hash.startsWith(h1);
  if(!ok){ res.innerHTML = "<span class='bad'>❌ HASH INVALIDE</span>"; return; }
  if(trouve.statut === "revoque"){ res.innerHTML = "<span class='bad'>❌ CERTIFICAT REVOQUE</span>"; }
  else { res.innerHTML = "<span class='ok'>✅ CERTIFICAT AUTHENTIQUE</span>"; }
  infos.innerHTML = `<p><b>Nom :</b> ${trouve.nom||""}</p><p><b>Titre :</b> ${trouve.titre||""}</p><p><b>Organisation :</b> ${trouve.organisation||"ELAN"}</p><p><b>No ID :</b> ${trouve.no_id}</p><p><b>Hash :</b> ${h1}</p>`;
}
</script>
</body>
</html>
