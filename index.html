<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification ELAN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 520px;
      margin: auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      padding: 12px;
      width: 100%;
      background: #0052be;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .ok, .bad {
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: left;
    }

    .ok {
      background: #e6ffe6;
      border: 2px solid green;
    }

    .bad {
      background: #ffe6e6;
      border: 2px solid red;
    }
  </style>
</head>
<body>
  <h2>Vérification ELAN</h2>

  <input id="no_id" placeholder="No ID" autocomplete="off">
  <input id="hash" placeholder="Hash" autocomplete="off">
  <button type="button" onclick="verifier()">Vérifier</button>

  <div id="resultat" aria-live="polite"></div>

  <script>
    function normaliser(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== "object") return [];

      for (const cle of ["membres", "preuves", "certificats"]) {
        if (Array.isArray(data[cle])) return data[cle];
      }

      if (data.no_id || data.id || data.hash || data.hash_complet) {
        return [data];
      }

      const valeurs = Object.values(data);
      if (valeurs.length && valeurs.every(v => v && typeof v === "object")) {
        return valeurs;
      }

      return [];
    }

    async function chargerFichier(nom) {
      const reponse = await fetch(`${nom}?v=${Date.now()}`, {
        cache: "no-store"
      });

      if (!reponse.ok) {
        throw new Error(`Impossible de charger ${nom}`);
      }

      return normaliser(await reponse.json());
    }

    function afficherErreur(message) {
      const resultat = document.getElementById("resultat");
      resultat.replaceChildren();

      const bloc = document.createElement("div");
      bloc.className = "bad";
      bloc.textContent = message;
      resultat.appendChild(bloc);
    }

    function ajouterChamp(parent, libelle, valeur) {
      if (valeur === undefined || valeur === null || String(valeur).trim() === "") {
        return;
      }

      parent.appendChild(
        document.createTextNode(`${libelle} : ${valeur}`)
      );
      parent.appendChild(document.createElement("br"));
    }

    async function verifier() {
      const noId = document.getElementById("no_id").value.trim().toUpperCase();
      const hash = document.getElementById("hash").value.trim().toLowerCase();
      const resultat = document.getElementById("resultat");

      resultat.replaceChildren();

      if (!noId || !hash) {
        resultat.textContent = "Veuillez saisir le No ID et le hash.";
        return;
      }

      resultat.textContent = "Vérification...";

      try {
        const [membres, preuves] = await Promise.all([
          chargerFichier("Membres.json"),
          chargerFichier("preuves.json")
        ]);

        const membre = membres.find(item =>
          String(item.no_id || item.id || "").trim().toUpperCase() === noId
        );

        if (membre) {
          const hashEnregistre = String(
            membre.hash_complet || membre.hash || ""
          ).trim().toLowerCase();

          if (hashEnregistre !== hash) {
            afficherErreur("Hash invalide.");
            return;
          }

          const statutBrut = String(membre.statut || "")
            .trim()
            .toLowerCase();

          const estActif =
            statutBrut === "membre actif" || statutBrut === "actif";

          resultat.replaceChildren();

          const carte = document.createElement("div");
          carte.className = "ok";

          const titre = document.createElement("strong");
          titre.textContent = estActif
            ? "MEMBRE ACTIF — IDENTITÉ VÉRIFIÉE"
            : "NON MEMBRE — IDENTITÉ VÉRIFIÉE";
          carte.appendChild(titre);

          const details = document.createElement("p");
          ajouterChamp(details, "Statut", estActif ? "Membre actif" : "Non membre");
          ajouterChamp(details, "Nom", membre.nom);
          ajouterChamp(details, "Téléphone", membre.telephone);
          ajouterChamp(details, "Organisation", membre.organisation);
          ajouterChamp(details, "Fonction", membre.fonction);
          ajouterChamp(details, "E-mail", membre.mail);
          ajouterChamp(details, "No ID", membre.no_id || membre.id);

          carte.appendChild(details);
          resultat.appendChild(carte);
          return;
        }

        const certificat = preuves.find(item =>
          String(item.no_id || item.id || "").trim().toUpperCase() === noId
        );

        if (!certificat) {
          afficherErreur("Aucun membre ou certificat trouvé pour cet ID.");
          return;
        }

        const hashEnregistre = String(
          certificat.hash_complet || certificat.hash || ""
        ).trim().toLowerCase();

        if (hashEnregistre !== hash) {
          afficherErreur("Hash invalide.");
          return;
        }

        resultat.replaceChildren();

        const carte = document.createElement("div");
        carte.className = "ok";

        const titre = document.createElement("strong");
        titre.textContent = "CERTIFICAT AUTHENTIQUE";
        carte.appendChild(titre);

        const details = document.createElement("p");
        ajouterChamp(details, "Nom", certificat.nom);
        ajouterChamp(details, "Formation", certificat.formation || certificat.titre);
        ajouterChamp(details, "Date", certificat.date);
        ajouterChamp(details, "No ID", certificat.no_id || certificat.id);
        ajouterChamp(details, "Statut", certificat.statut);

        carte.appendChild(details);
        resultat.appendChild(carte);
      } catch (erreur) {
        afficherErreur(
          "Impossible de charger Membres.json ou preuves.json. Vérifiez qu’ils sont publiés au même emplacement que cette page."
        );
        console.error(erreur);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const parametres = new URLSearchParams(window.location.search);
      const noId = parametres.get("no_id");
      const hash = parametres.get("hash");

      if (noId && hash) {
        document.getElementById("no_id").value = noId;
        document.getElementById("hash").value = hash;
        verifier();
      }
    });
  </script>
</body>
</html>
