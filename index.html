    let typeActuel = "personnel";

    function choisir(type) {
      typeActuel = type;

      document.getElementById("tab-personnel")
        .classList.toggle("actif", type === "personnel");
      document.getElementById("tab-certificat")
        .classList.toggle("actif", type === "certificat");

      document.getElementById("resultat").style.display = "none";
      document.getElementById("infos").style.display = "none";
    }

    async function chargerFichier(listeNoms) {
      for (const nom of listeNoms) {
        try {
          const reponse = await fetch(encodeURI(nom));

          if (reponse.ok) {
            return await reponse.json();
          }
        } catch (erreur) {
          // Essaie le nom de fichier suivant.
        }
      }

      throw new Error("Fichier introuvable");
    }

    function nettoyerPersonnel(valeur) {
      try {
        valeur = decodeURIComponent(String(valeur ?? ""));
      } catch (erreur) {
        valeur = String(valeur ?? "");
      }

      return valeur.trim().toUpperCase().replace(/\s+/g, "");
    }

    function afficherInfos(infos, lignes) {
      infos.replaceChildren();

      lignes.forEach(([libelle, valeur], index) => {
        const titre = document.createElement("b");
        titre.textContent = libelle + " ";
        infos.appendChild(titre);
        infos.appendChild(document.createTextNode(String(valeur ?? "")));

        if (index < lignes.length - 1) {
          infos.appendChild(document.createElement("br"));
        }
      });

      infos.style.display = "block";
    }

    async function verifier() {
      const noIdBrut = document.getElementById("no_id").value.trim();
      const noId = nettoyerPersonnel(noIdBrut);
      const hashSaisi = document.getElementById("hash").value.trim();
      const resultat = document.getElementById("resultat");
      const infos = document.getElementById("infos");

      infos.style.display = "none";
      infos.replaceChildren();

      if (!noId || !hashSaisi) {
        resultat.style.display = "block";

        return;

            "preuves_id_json",
            "personnel.json",
            "personnels.json",
            "preuves_id_employes.json"

          donnees = liste.certificats;

          donnees = liste.employes;
        } else if (liste && typeof liste === "object") {
          donnees = Object.values(liste);
        }

        const personne = donnees.find((element) => {
          if (!element || typeof element !== "object") {
            return false;
          }

          const identifiants = [
            element.no_id,
            element.id,
            element.numero,
            element.ref,
            element.matricule,
            element.matricule_id,
            element.code_id,
            element.identifiant,
            element.identification,
            element.badge,
            element.badge_id,
            element["No ID"],
            element["NO_ID"],
            element["No_Id"]
          ];

          return identifiants.some(
            (valeur) => nettoyerPersonnel(valeur) === noId
          );
        });

        resultat.style.display = "block";

        if (!personne) {
          resultat.style.background = "#FCE8E6";
          resultat.style.color = "#A50E0E";
          resultat.textContent = typeActuel === "personnel"
            ? "❌ PERSONNE NON RECONNUE - Pas dans le personnel ELAN CONSULT"
            : "❌ FAUX CERTIFICAT - Non reconnu";
          return;

          const hashes = [

            personne.hash_complet,
            personne.hash_badge,
            personne.badge_hash,
            personne.code,
            personne.code_verification,
            personne.verification_hash,
            personne["Hash"],
            personne["HASH"]
          ]
            .filter((valeur) => valeur !== undefined && valeur !== null && String(valeur).trim() !== "")
            .map(nettoyerPersonnel);

          const hashNormalise = nettoyerPersonnel(hashSaisi);

          // Le hash doit être complet et identique après normalisation.
          hashValide = hashNormalise.length > 0 &&
            hashes.some((hash) => hash.length > 0 && hash === hashNormalise);
        } else {
          const hashFichier = String(
            personne.hash || personne.hash_complet || personne.code || ""
          ).trim().toUpperCase();

          hashValide = hashFichier.length > 0 &&
            hashFichier === hashSaisi.toUpperCase();
        }

        if (!hashValide) {
          resultat.style.background = "#FCE8E6";
          resultat.style.color = "#A50E0E";
          resultat.textContent = typeActuel === "personnel"
            ? "❌ BADGE FALSIFIÉ - Hash incorrect"
            : "❌ FAUX CERTIFICAT - Hash incorrect";
          return;
        }

        const nom = personne.nom || personne.titulaire || personne.beneficiaire || "";
        const fonction = personne.fonction || personne.titre || personne.type || "";
        const entreprise = personne.entreprise || "ELAN CONSULT";
        const statut = String(personne.statut || personne.status || "Actif");

        afficherInfos(infos, [
          ["Nom :", nom],
          ["Détail :", fonction],
          ["Entreprise :", entreprise],
          ["No ID :", noIdBrut]
        ]);

        if (typeActuel === "personnel") {
          if (statut.toLowerCase().includes("actif")) {
            resultat.style.background = "#E6F4EA";
            resultat.style.color = "#137333";
            resultat.textContent = "✅ EMPLOYÉ VÉRIFIÉ - ACTIF chez " + entreprise;
          } else {
            resultat.style.background = "#FFF3CD";
            resultat.style.color = "#856404";
            resultat.textContent = "⚠️ A QUITTÉ L'ENTREPRISE - Ne plus accepter ce badge";
          }
        } else if (
          statut.toLowerCase().includes("annul") ||
          statut.toLowerCase().includes("expir") ||
          statut.toLowerCase().includes("invalide")
        ) {
          resultat.style.background = "#FFF3CD";
          resultat.style.color = "#856404";
          resultat.textContent = "⚠️ CERTIFICAT ANNULÉ / EXPIRÉ - " + statut;
        } else {
          resultat.style.background = "#E6F4EA";
          resultat.style.color = "#137333";
          resultat.textContent = "✅ CERTIFICAT VRAI - VALIDE - " + nom;
        }
      } catch (erreur) {
        resultat.style.display = "block";
        resultat.style.background = "#FCE8E6";
        resultat.style.color = "#A50E0E";
        resultat.textContent =
          "❌ Fichier de vérification introuvable ou inaccessible.";
      }
    }

    // Paramètres transmis par le QR code.
    const params = new URLSearchParams(window.location.search);
    const typeUrl = (params.get("type") || "").toLowerCase();

    if (typeUrl === "personnel" || typeUrl === "certificat") {
      choisir(typeUrl);
    }

    const hashQr = params.get("hash");

    if (hashQr) {
      document.getElementById("hash").value = hashQr;
      document.getElementById("hash").readOnly = true;
    }

    if (typeUrl === "personnel") {
      document.getElementById("no_id").value = "";
      document.getElementById("no_id").focus();
    } else if (typeUrl === "certificat") {
      if (params.get("id")) {
        document.getElementById("no_id").value = params.get("id");
      }
    } else if (params.get("no_id") || params.get("hash")) {
      document.getElementById("no_id").value = "";
      document.getElementById("no_id").focus();
    }
  </script>
