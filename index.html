<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification ELAN</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:20px;background:#f5f5f5}
.container{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.box{border:2px solid #0052be;border-radius:12px;padding:20px;width:380px;background:white;text-align:left}
.box.cert{border-color:#009933}
h2{text-align:center;color:#0052be}.box.cert h2{color:#009933}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;background:#0052be;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.box.cert button{background:#009933}
.ok{color:green;font-weight:bold;text-align:center}.bad{color:red;font-weight:bold;text-align:center}
</style>
</head>
<body>
<h1>Verification ELAN</h1>
<div class="container">
<div class="box">
<h2>Verification Membre</h2>
<input id="no_id_membre" placeholder="M_00001">
<input id="hash_membre" placeholder="Hash Membre">
<button id="btnMembre" type="button">Verifier Membre</button>
<p id="res_membre"></p><div id="infos_membre"></div>
</div>
<div class="box cert">
<h2>Verification Certificat</h2>
<input id="no_id_cert" placeholder="ELAN-2026-03">
<input id="hash_cert" placeholder="Hash Certificat">
<button id="btnCert" type="button">Verifier Certificat</button>
<p id="res_cert"></p><div id="infos_cert"></div>
</div>
</div>
<script>
// DONNEES DANS LA PAGE - LE BOUTON NE BLOQUE PLUS MEME SANS FICHIER JSON
const MEMBRES = [
  {no_id:"M_00001", nom:"Habiyakare Longin", fonction:"DGA", hash:"f691429ea213", hash_complet:"f691429ea213aaa694516", statut:"actif"}
];
const CERTS = [
  {no_id:"ELAN-2026-03", nom:"Habiyakare Longin", titre:"Certificat ELAN", hash:"c90294e56145445bfa19c", hash_complet:"c90294e56145445bfa19c", statut:"actif"}
];

document.getElementById("btnMembre").addEventListener("click", verifMembre);
document.getElementById("btnCert").addEventListener("click", verifCert);

// AUTO AU SCAN : ON NE REMPLIT QUE LA BONNE FENETRE
window.addEventListener("load", async ()=>{
  const p = new URLSearchParams(window.location.search);
  const no_id = (p.get("no_id")||p.get("id")||"").trim();
  const hash = (p.get("hash")||p.get("h")||"").trim();
  const type = (p.get("type")||"").toLowerCase();
  if(!no_id || !hash) return;
  if(type.includes("cert") || no_id.startsWith("ELAN-")){
    document.getElementById("no_id_cert").value = no_id;
    document.getElementById("hash_cert").value = hash;
    verifCert();
  } else if(type.includes("mem") || no_id.startsWith("M_")){
    document.getElementById("no_id_membre").value = no_id;
    document.getElementById("hash_membre").value = hash;
    verifMembre();
  }
});

async function getData(file, local){
  try{
    const ctrl = new AbortController();
    setTimeout(()=>ctrl.abort(), 2000); // si le fichier bloque, on ne reste pas sur Verification...
    const r = await fetch(file+"?v="+Date.now(), {signal: ctrl.signal});
    if(!r.ok) return local;
    const d = await r.json();
    if(!Array.isArray(d) || d.length===0) return local;
    return d.concat(local); // fichier + donnees dans la page
  }catch(e){ return local; }
}

async function verifMembre(){
  const no_id=document.getElementById("no_id_membre").value.trim();
  const hash=document.getElementById("hash_membre").value.trim().toLowerCase();
  const res=document.getElementById("res_membre"); const infos=document.getElementById("infos_membre");
  infos.innerHTML="";
  if(!no_id||!hash){res.innerHTML="<span class='bad'>Entrez No ID + Hash</span>";return;}
  res.innerHTML="Verification...";
  const data=await getData("Membres.json", MEMBRES);
  const t=data.find(x=>String(x.no_id).trim()===no_id);
  if(!t){res.innerHTML="<span class='bad'>❌ NON MEMBRE</span>";return;}
  const h1=String(t.hash||"").toLowerCase(); const h2=String(t.hash_complet||"").toLowerCase();
  if(!(hash===h1||hash===h2||h2.startsWith(hash)||hash.startsWith(h1))){res.innerHTML="<span class='bad'>❌ NON MEMBRE - HASH INVALIDE</span>";return;}
  if(t.statut==="actif"||!t.statut){res.innerHTML="<span class='ok'>✅ MEMBRE ACTIF</span>";}
  else{res.innerHTML="<span class='bad'>❌ NON MEMBRE - INACTIF / REVOQUE</span>";}
  infos.innerHTML=`<p><b>Nom :</b> ${t.nom||""}</p><p><b>Fonction :</b> ${t.fonction||""}</p><p><b>No ID :</b> ${t.no_id}</p>`;
}

async function verifCert(){
  const no_id=document.getElementById("no_id_cert").value.trim();
  const hash=document.getElementById("hash_cert").value.trim().toLowerCase();
  const res=document.getElementById("res_cert"); const infos=document.getElementById("infos_cert");
  infos.innerHTML="";
  if(!no_id||!hash){res.innerHTML="<span class='bad'>Entrez No ID + Hash</span>";return;}
  res.innerHTML="Verification...";
  const data=await getData("Certificats.json", CERTS);
  const t=data.find(x=>String(x.no_id).trim()===no_id);
  if(!t){res.innerHTML="<span class='bad'>❌ CERTIFICAT INTROUVABLE</span>";return;}
  const h1=String(t.hash||"").toLowerCase(); const h2=String(t.hash_complet||"").toLowerCase();
  if(!(hash===h1||hash===h2||h2.startsWith(hash)||hash.startsWith(h1))){res.innerHTML="<span class='bad'>❌ HASH INVALIDE</span>";return;}
  if(t.statut==="revoque"){res.innerHTML="<span class='bad'>❌ CERTIFICAT REVOQUE</span>";}
  else{res.innerHTML="<span class='ok'>✅ CERTIFICAT AUTHENTIQUE</span>";}
  infos.innerHTML=`<p><b>Nom :</b> ${t.nom||""}</p><p><b>Titre :</b> ${t.titre||""}</p><p><b>No ID :</b> ${t.no_id}</p>`;
}
</script>
</body>
</html>
