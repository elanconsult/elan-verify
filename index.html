<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification ELAN</title>
<style>
body{font-family:Arial;padding:20px;max-width:520px;margin:auto;text-align:center}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{padding:12px;width:100%;background:#0052be;color:white;border:none;border-radius:8px;cursor:pointer}
.ok{background:#e6ffe6;border:2px solid green;padding:18px;border-radius:12px;margin-top:15px;text-align:left}
.bad{background:#ffe6e6;border:2px solid red;padding:15px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<h2>Vérification ELAN</h2>
<input id="no_id" placeholder="No ID">
<input id="hash" placeholder="Hash">
<button onclick="verifier()">Vérifier</button>
<div id="resultat"></div>
<script>
function normaliser(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(data.certificats && Array.isArray(data.certificats)) return data.certificats;
  if(data.preuves && Array.isArray(data.preuves)) return data.preuves;
  if(data.no_id || data.id || data.hash) return [data];
  if(typeof data === "object"){
    const vals = Object.values(data);
    if(vals.length && typeof vals[0] === "object") return vals;
  }
  return [];
}
async function charger(){
  let liste=[];
  const fichiers = ["Certificats.json", "certificats.json", "preuves.json", "Preuves.json"];
  for(const f of fichiers){
    try{
      const r=await fetch(f+"?v="+Date.now());
      if(r.ok){
        const d=await r.json();
        liste=liste.concat(normaliser(d));
      }
    }catch(e){}
  }
  try{
    const local=JSON.parse(localStorage.getItem("elan_preuves")||"[]");
    if(Array.isArray(local)) liste=liste.concat(local);
  }catch(e){}
  return liste;
}
async function verifier(){
  const no_id=document.getElementById("no_id").value.trim().toUpperCase();
  const hash=document.getElementById("hash").value.trim().toLowerCase();
  const div=document.getElementById("resultat");
  if(!no_id||!hash){ div.innerHTML=""; return; }
  div.innerHTML="Vérification...";
  const liste=await charger();
  const c=liste.find(x=>String(x.no_id||x.id||"").trim().toUpperCase()===no_id);
  if(!c){ div.innerHTML=`<div class='bad'>CERTIFICAT INTROUVABLE<br><small>${no_id}</small></div>`; return; }
  const vrai=String(c.hash_complet||c.hash||"").trim().toLowerCase();
  if(vrai!==hash){ div.innerHTML=`<div class='bad'>HASH INVALIDE</div>`; return; }
  div.innerHTML=`<div class='ok'>CERTIFICAT AUTHENTIQUE - ${c.statut||""}<br><br><b>${c.nom||""}</b><br><br><b>Formation :</b> ${c.formation||c.titre||""}<br><b>No ID :</b> ${c.no_id}<br><b>Du :</b> ${c.date_debut||""} <b>au :</b> ${c.date_fin||""}<br><b>Généré le :</b> ${c.date_generation||""}</div>`;
}
window.onload=()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("no_id")&&p.get("hash")){document.getElementById("no_id").value=p.get("no_id");document.getElementById("hash").value=p.get("hash");verifier();}
};
</script>
</body>
</html>
